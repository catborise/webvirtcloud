[program:webvirtcloud]
command=/srv/webvirtcloud/venv/bin/gunicorn webvirtcloud.wsgi:application -c /srv/webvirtcloud/gunicorn.conf.py
directory=/srv/webvirtcloud
user=www-data
autostart=true
autorestart=true
redirect_stderr=true

[program:novncd]
command=/srv/webvirtcloud/venv/bin/python3 /srv/webvirtcloud/console/novncd
directory=/srv/webvirtcloud
user=www-data
autostart=true
autorestart=true
redirect_stderr=true

# Serial console daemon. Disabled by default because it does not authenticate
# connections yet; set SERIAL_CONSOLE_ENABLED = True in settings.py and
# autostart=true here only on a trusted network.
[program:socketiod]
command=/srv/webvirtcloud/venv/bin/python3 /srv/webvirtcloud/console/socketiod
directory=/srv/webvirtcloud
user=www-data
autostart=false
autorestart=true
redirect_stderr=true

# The job worker: one per installation. It drains running jobs for 60 s on
# stop; supervisor waits a little longer before killing it.
[program:webvirt-worker]
command=/srv/webvirtcloud/venv/bin/python3 /srv/webvirtcloud/manage.py run_worker
directory=/srv/webvirtcloud
user=www-data
environment=WEBVIRTCLOUD_LOG_FILE="/srv/webvirtcloud/data/webvirtcloud-worker.log"
autostart=true
autorestart=true
stopwaitsecs=90
redirect_stderr=true
