[tool.ruff]
target-version = "py310"
extend-exclude = ["static"]

[tool.ruff.lint]
# Syntax errors and pyflakes; widen the rule set step by step.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Settings overlay: re-exports the base settings by design.
"webvirtcloud/settings-dev.py" = ["F403", "F405"]
